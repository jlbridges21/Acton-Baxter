display_information:
  name: Baxter
  description: >-
    Acton ADU’s internal AI assistant for approved company knowledge,
    procedures, processes, and general employee assistance.
  background_color: "#0B1F33"
features:
  bot_user:
    display_name: Baxter
    always_online: true
  slash_commands:
    - command: /property
      url: https://acton-baxter.vercel.app/api/slack/commands/property
      description: Research a property address with Baxter Property Research
      usage_hint: "[address]"
      should_escape: false
    - command: /clear
      url: https://acton-baxter.vercel.app/api/slack/commands/clear
      description: Clear / reset your Baxter conversation
      usage_hint: ""
      should_escape: false
    - command: /help
      url: https://acton-baxter.vercel.app/api/slack/commands/help
      description: Show Baxter capabilities and examples
      usage_hint: ""
      should_escape: false
    - command: /recall
      url: https://acton-baxter.vercel.app/api/slack/commands/recall
      description: Search Slack history with Baxter
      usage_hint: "[query]"
      should_escape: false
    - command: /pem
      url: https://acton-baxter.vercel.app/api/slack/commands/pem
      description: Start a Partnership Evaluation Meeting NEAT
      usage_hint: ""
      should_escape: false
oauth_config:
  redirect_urls:
    - https://acton-baxter.vercel.app/api/slack/search/oauth/callback
  scopes:
    bot:
      # Required — conversational Baxter
      - app_mentions:read
      - chat:write
      - im:history
      # Required — slash commands
      - commands
      # Admin UX — resolve human-readable user names (users.info)
      - users:read
      - users.profile:read
      # Admin UX — resolve public channel names (conversations.info)
      - channels:read
      # Processing indicator — add/remove 👀 on the user’s triggering message
      - reactions:write
      # Slack Search (Prompt 1) — public Real-time Search + thread context
      - search:read.public
      - search:read.users
      - search:read.files
      - channels:history
    user:
      # Per-user Slack Search — visibility matches the authorizing employee
      - search:read.public
      - search:read.private
      - search:read.im
      - search:read.mpim
      - search:read.users
      - search:read.files
      - users:read
      - users:read.email
      - channels:history
      - groups:history
      - im:history
      - mpim:history
      - channels:read
      - groups:read
settings:
  event_subscriptions:
    request_url: https://acton-baxter.vercel.app/api/slack/events
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
    request_url: https://acton-baxter.vercel.app/api/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
